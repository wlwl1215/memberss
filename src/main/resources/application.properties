spring.application.name=memberss

# 1. 도커로 띄운 MySQL DB 연결 주소 (포트 3307, 패스워드 1234)
spring.datasource.url=jdbc:mysql://localhost:3307/memberss?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. MyBatis가 우리가 직접 만든 XML 파일을 읽어갈 수 있도록 경로 지정
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml